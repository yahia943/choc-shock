<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choc-Shock | Scratch &amp; Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page: #ffffff;
    --panel: #ffffff;
    --panel-shadow: 0 10px 30px rgba(74, 42, 23, .18);
    --ink: #4a2a17;
    --ink-soft: #7d5a46;
    --red: #e5192b;
    --gold: #f6b645;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background-color: var(--page);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 22px 14px 40px;
  }
  .panel {
    width: min(100%, 400px);
    padding: 6px 4px 16px;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo {
    width: min(86%, 310px); height: auto; display: block;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 10px rgba(74,42,23,.35));
  }
  h1 {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700; font-size: clamp(1.7rem, 7vw, 2.2rem);
    line-height: 1.05; margin: 16px 0 10px; text-align: center; color: var(--red);
    -webkit-text-stroke: 7px #fff; paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(74,42,23,.25);
  }
  .sub {
    margin: 0 0 20px; color: var(--ink); text-align: center; max-width: 30ch; line-height: 1.4;
    background: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 500;
    box-shadow: 0 4px 12px rgba(74,42,23,.18);
  }

  .card-wrap { width: 100%; }
  .ticket {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: #fff7ec;
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 5px 5px 0 var(--red);
    overflow: hidden; display: grid; place-items: center; touch-action: none;
  }
  .prize {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; gap: 6px;
  }
  .prize .emoji { font-size: 2.6rem; line-height: 1; }
  .prize .label {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700; font-size: clamp(1.25rem, 6.2vw, 1.7rem); line-height: 1.15; color: var(--red); max-width: 92%;
  }
  .prize .kicker { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .prize .reward {
    margin-top: 4px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .95rem;
    background: var(--gold); color: #4a2a17; border: 2px solid #4a2a17;
  }
  canvas#foil {
    position: absolute; inset: 0; width: 100%; height: 100%;
    cursor: grab; touch-action: none; transition: opacity .45s ease;
  }
  canvas#foil.gone { opacity: 0; pointer-events: none; }

  .actions { margin-top: 22px; width: 100%; display: flex; flex-direction: column; }
  button.reveal {
    font: inherit; font-weight: 700; padding: 12px 18px;
    background: #fff; color: var(--ink);
    border: 2px solid var(--ink-soft); border-radius: 999px; cursor: pointer;
  }
  button.reveal:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

  .result { display: none; margin-top: 22px; width: 100%; text-align: center; background: #fff; border-radius: 24px; padding: 20px 18px 18px; box-shadow: 0 8px 22px rgba(74,42,23,.22); }
  .result.show { display: block; }
  .result h2 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; margin: 0 0 6px; font-size: 1.5rem; color: var(--ink); }
  .result p { margin: 0 0 14px; color: var(--ink-soft); line-height: 1.45; }
  .code {
    display: inline-block; font-family: "Fredoka", system-ui, sans-serif; font-weight: 700;
    font-size: 1.6rem; letter-spacing: .1em; padding: 12px 22px; border-radius: 16px;
    background: var(--gold); color: #4a2a17; border: 3px dashed #4a2a17;
  }
  .note { font-size: .85rem; color: var(--ink-soft); margin-top: 14px; }

  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 10; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
  .zap-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  .zap-flash { position: absolute; inset: 0; background: #fff6a8; opacity: 0; animation: zapflash .6s ease-out forwards; }
  @keyframes zapflash { 0% { opacity: 0; } 8% { opacity: .9; } 22% { opacity: .15; } 34% { opacity: .65; } 100% { opacity: 0; } }
  .zap-bolt { position: absolute; fill: var(--red); stroke: #1a0d08; stroke-width: 6; stroke-linejoin: round;
    filter: drop-shadow(0 0 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff);
    opacity: 0; animation: zappop 1.2s ease-out forwards; }
  .zap-bolt.b1 { left: 4%;  top: 12%; height: 36vh; transform: rotate(-16deg); }
  .zap-bolt.b2 { right: 4%; top: 28%; height: 42vh; transform: rotate(14deg); animation-delay: .08s; }
  .zap-bolt.b3 { left: 20%; bottom: 8%; height: 24vh; transform: rotate(8deg); animation-delay: .16s; }
  @keyframes zappop {
    0% { opacity: 0; scale: .2; } 14% { opacity: 1; scale: 1.3; } 28% { scale: .95; } 38% { scale: 1.05; }
    70% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: 1; }
  }
  .zap-text {
    position: absolute; left: 50%; top: 42%; translate: -50% -50%; rotate: -8deg;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 700;
    font-size: clamp(4.5rem, 26vw, 8rem); line-height: 1; color: var(--red);
    -webkit-text-stroke: 10px #1a0d08; paint-order: stroke fill;
    text-shadow: 6px 6px 0 #fff;
    opacity: 0; animation: zaptext 1.4s ease-out forwards;
  }
  @keyframes zaptext {
    0% { opacity: 0; scale: .3; } 14% { opacity: 1; scale: 1.35; } 26% { scale: .95; } 36% { scale: 1.08; }
    72% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: 1.1; }
  }
  .ticket.shake { animation: shake .55s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); } 10% { transform: translate(-7px,3px) rotate(-1.5deg); }
    20% { transform: translate(6px,-4px) rotate(1.5deg); } 30% { transform: translate(-6px,-2px) rotate(-1deg); }
    40% { transform: translate(5px,3px) rotate(1deg); } 55% { transform: translate(-3px,1px); } 70% { transform: translate(2px,-1px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti, .zap-flash, .zap-bolt { display: none; }
    canvas#foil { transition: none; }
    .ticket.shake { animation: none; }
  }
</style>
</head>

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Scratch here", W / 2, H / 2 - W * 0.02);
    ctx.font = Math.round(W * 0.07) + "px sans-serif";
    ctx.fillText("🍪", W / 2, H / 2 + W * 0.1);
  }
  function size() {
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintFoil();
  }
  function scratch(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(x, y, Math.max(18, W * 0.065), 0, Math.PI * 2); ctx.fill();
    var now = Date.now();
    if (now - lastCheck > 150) { lastCheck = now; checkProgress(); }
  }
  function checkProgress() {
    if (done) return;
    var step = 8, w = canvas.width, h = canvas.height, cleared = 0, total = 0;
    var data = ctx.getImageData(0, 0, w, h).data;
    for (var y = 0; y < h; y += step * 2) {
      for (var x = 0; x < w; x += step * 2) { total++; if (data[(y * w + x) * 4 + 3] < 40) cleared++; }
    }
    if (cleared / total > 0.5) reveal();
  }
  canvas.addEventListener("pointerdown", function (e) { if (done) return; drawing = true; canvas.setPointerCapture(e.pointerId); scratch(e); });
  canvas.addEventListener("pointermove", function (e) { if (drawing && !done) scratch(e); });
  function stop() { drawing = false; checkProgress(); }
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#e5192b", "#f6b645", "#4a2a17", "#ff7a85", "#ffd166"];
    for (var i = 0; i < 70; i++) {
      var d = document.createElement("div");
      d.className = "confetti";
      d.style.left = Math.random() * 100 + "vw";
      d.style.background = colors[i % colors.length];
      d.style.animationDuration = (2 + Math.random() * 2.2) + "s";
      d.style.animationDelay = (Math.random() * 0.5) + "s";
      d.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
      document.body.appendChild(d);
      setTimeout(function (el) { el.remove(); }.bind(null, d), 5200);
    }
  }
  function bolt(cls) {
    return '<svg class="zap-bolt ' + cls + '" viewBox="0 0 100 160" aria-hidden="true"><polygon points="62,3 15,88 46,88 30,157 89,62 56,62"/></svg>';
  }
  function zap() {
    try { if (navigator.vibrate) navigator.vibrate([40, 30, 90]); } catch (e) {}
    var layer = document.createElement("div");
    layer.className = "zap-layer";
    layer.setAttribute("aria-hidden", "true");
    layer.innerHTML = '<div class="zap-flash"></div>' + bolt("b1") + bolt("b2") + bolt("b3") + '<div class="zap-text">ZAP!</div>';
    document.body.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 1700);
    var tk = $("ticket");
    tk.classList.add("shake");
    setTimeout(function () { tk.classList.remove("shake"); }, 650);
  }
  function reveal(fromSaved) {
    if (done) return;
    done = true;
    canvas.classList.add("gone");
    $("actions").style.display = "none";
    $("resTitle").textContent = "Challenge accepted!";
    $("resText").textContent = "Complete it, then show your photo or video and this code at the counter to win " + prize.reward.toLowerCase() + ".";
    $("code").textContent = state.code;
    $("result").classList.add("show");
    $("sub").textContent = fromSaved ? "You already have your challenge. Show your proof + code at the counter." : "Zap! Challenge unlocked!";
    if (!fromSaved) { zap(); setTimeout(confetti, 350); state.revealed = true; save(state); }
  }
  $("revealBtn").addEventListener("click", function () { reveal(false); });

  size();
  window.addEventListener("resize", function () { if (!done) size(); });
  if (state.revealed) reveal(true);
})();
</script>
</body>
</html>
